<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="csrf-token" content="">
<title>My Courses — ATTENDER</title>
<link rel="icon" href="../assets/img/logo.svg">
<link rel="stylesheet" href="../assets/vendor/bootstrap/bootstrap.min.css">
<link rel="stylesheet" href="../assets/vendor/icons/bootstrap-icons.min.css">
<link rel="stylesheet" href="../assets/css/attender.css">
</head>
<body>
<div id="app-root">
<div class="page-head">
  <div><h2>My courses</h2><p>Each course belongs to one of your classes. Enrolment is managed per course.</p></div>
  <button class="btn btn-primary" id="new"><i class="bi bi-plus-lg me-2"></i>New course</button>
</div>
<div class="at-card">
  <div class="at-card-header"><div class="input-icon" style="max-width:320px;flex:1"><i class="bi bi-search"></i><input class="form-control" id="q" placeholder="Search by code or title"></div>
    <select class="form-select" id="fc" style="max-width:260px"></select></div>
  <div class="table-responsive" id="tbl"></div>
</div>

<div class="modal fade" id="m" tabindex="-1"><div class="modal-dialog modal-lg modal-dialog-centered"><form class="modal-content" id="f" novalidate>
  <div class="modal-header"><h5 class="modal-title" id="mt">New course</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
  <div class="modal-body"><input type="hidden" id="id"><div class="row g-3">
    <div class="col-md-4"><label class="form-label">Course code *</label><input class="form-control" id="code" placeholder="CSC 305" required></div>
    <div class="col-md-8"><label class="form-label">Course title *</label><input class="form-control" id="title" placeholder="Data Structures" required></div>
    <div class="col-md-6"><label class="form-label">Class *</label><select class="form-select" id="class" required></select></div>
    <div class="col-md-3"><label class="form-label">Semester</label><select class="form-select" id="sem"><option>First</option><option>Second</option></select></div>
    <div class="col-md-3"><label class="form-label">Academic year</label><input class="form-control" id="year" value="2026/2027"></div>
    <div class="col-12"><label class="form-label">Description</label><textarea class="form-control" id="desc" rows="2"></textarea></div>
  </div></div>
  <div class="modal-footer"><button type="button" class="btn btn-ghost" data-bs-dismiss="modal">Cancel</button><button class="btn btn-primary" type="submit">Save course</button></div>
</form></div></div>
</div>
<script src="../assets/vendor/bootstrap/bootstrap.bundle.min.js"></script>
<script src="../assets/vendor/chartjs/chart.umd.js"></script>
<script src="../assets/vendor/qrcode/qrcode.min.js"></script>
<script src="../assets/js/config.js"></script><script src="../assets/js/api.js"></script>
<script src="../assets/js/core.js"></script>
<script>
AT.shell({ title: "My Courses", active: "courses", crumb: "Academics" });
const modal = new bootstrap.Modal('#m'); let courses = [], classes = [];
function draw() {
  const q = AT.$('#q').value.toLowerCase(), fc = AT.$('#fc').value;
  const rows = courses.filter(function (c) { return (!fc || String(c.classId) === fc) && (c.code + ' ' + c.title).toLowerCase().indexOf(q) >= 0; });
  AT.$('#tbl').innerHTML = rows.length ? '<table class="at-table"><thead><tr><th>Course</th><th>Class</th><th>Semester</th><th>Enrolled</th><th>Sessions</th><th></th></tr></thead><tbody>' + rows.map(function (c) {
    return '<tr><td><div class="fw-600">' + AT.esc(c.code) + '</div><div class="small text-muted">' + AT.esc(c.title) + '</div></td><td>' + AT.esc(c.class ? c.class.name : '—') + '</td><td>' + AT.esc(c.semester) + ' · ' + AT.esc(c.year) + '</td><td>' + c.enrolled + '</td><td>' + c.sessions + '</td>' +
    '<td class="text-end text-nowrap"><a class="btn btn-sm btn-soft" href="enrollment.html?course=' + c.id + '"><i class="bi bi-people me-1"></i>Enrolment</a> <button class="btn btn-sm btn-ghost" data-edit="' + c.id + '"><i class="bi bi-pencil"></i></button> <button class="btn btn-sm btn-ghost text-danger" data-del="' + c.id + '"><i class="bi bi-trash"></i></button></td></tr>'; }).join('') + '</tbody></table>' : AT.empty('journal-x', 'No courses found', 'Create a course or adjust your filters.');
}
function load() { return Promise.all([AT.api.courses(), AT.api.classes()]).then(function (r) { courses = r[0]; classes = r[1];
  AT.$('#fc').innerHTML = '<option value="">All classes</option>' + classes.map(function (c) { return '<option value="' + c.id + '">' + AT.esc(c.name) + '</option>'; }).join('');
  AT.$('#class').innerHTML = classes.map(function (c) { return '<option value="' + c.id + '">' + AT.esc(c.name) + '</option>'; }).join(''); draw(); }); }
function open(c) { c = c || {}; if (!classes.length) return AT.toast('Create a class first.', 'error'); AT.$('#mt').textContent = c.id ? 'Edit course' : 'New course'; AT.$('#id').value = c.id || ''; AT.$('#code').value = c.code || ''; AT.$('#title').value = c.title || ''; AT.$('#class').value = c.classId || classes[0].id; AT.$('#sem').value = c.semester || 'First'; AT.$('#year').value = c.year || '2026/2027'; AT.$('#desc').value = c.description || ''; modal.show(); }
AT.$('#new').onclick = function () { open(); };
AT.$('#q').oninput = draw; AT.$('#fc').onchange = draw;
AT.$('#f').onsubmit = function (e) { e.preventDefault(); const v = function (i) { return AT.$('#' + i).value.trim(); };
  if (!v('code') || !v('title')) return AT.toast('Course code and title are required.', 'error');
  const o = { code: v('code').toUpperCase(), title: v('title'), classId: v('class'), semester: v('sem'), year: v('year'), description: v('desc') }; if (v('id')) o.id = Number(v('id'));
  AT.api.saveCourse(o).then(function () { modal.hide(); AT.toast('Course saved'); load(); }); };
document.addEventListener('click', function (e) { const t = e.target.closest('[data-edit],[data-del]'); if (!t) return;
  if (t.dataset.edit) open(courses.find(function (c) { return c.id === Number(t.dataset.edit); }));
  else AT.confirm({ title: 'Delete this course?', text: 'Its enrolments and sessions will no longer be listed.', danger: true, ok: 'Delete course' }).then(function (ok) { if (ok) AT.api.deleteCourse(t.dataset.del).then(function () { AT.toast('Course deleted'); load(); }); }); });
load().then(function () { if (/new=1/.test(location.search)) open(); });
</script>
</body>
</html>
