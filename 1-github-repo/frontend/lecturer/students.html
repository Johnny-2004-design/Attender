<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="csrf-token" content="">
<title>Students — ATTENDER</title>
<link rel="icon" href="../assets/img/logo.svg">
<link rel="stylesheet" href="../assets/vendor/bootstrap/bootstrap.min.css">
<link rel="stylesheet" href="../assets/vendor/icons/bootstrap-icons.min.css">
<link rel="stylesheet" href="../assets/css/attender.css">
</head>
<body>
<div id="app-root">
<div class="page-head"><div><h2>Students</h2><p>Approved students across your classes. Open a student to see their attendance history.</p></div>
  <button class="btn btn-ghost bg-white" id="exp"><i class="bi bi-download me-2"></i>Export CSV</button></div>
<div class="at-card">
  <div class="at-card-header flex-wrap"><div class="input-icon" style="max-width:340px;flex:1;min-width:200px"><i class="bi bi-search"></i><input class="form-control" id="q" placeholder="Search name or index number"></div>
    <select class="form-select" id="fc" style="max-width:260px"></select></div>
  <div class="table-responsive" id="tbl"><div class="p-4 text-center text-muted">Loading…</div></div>
</div>

<div class="modal fade" id="m" tabindex="-1"><div class="modal-dialog modal-lg modal-dialog-centered modal-dialog-scrollable"><div class="modal-content">
  <div class="modal-header"><h5 class="modal-title">Student attendance history</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
  <div class="modal-body" id="mb"></div></div></div></div>
</div>
<script src="../assets/vendor/bootstrap/bootstrap.bundle.min.js"></script>
<script src="../assets/vendor/chartjs/chart.umd.js"></script>
<script src="../assets/vendor/qrcode/qrcode.min.js"></script>
<script src="../assets/js/config.js"></script><script src="../assets/js/api.js"></script>
<script src="../assets/js/core.js"></script>
<script>
AT.shell({ title: "Students", active: "students", crumb: "Academics" });
let all = [], classes = []; const modal = new bootstrap.Modal('#m');
function draw() {
  const q = AT.$('#q').value.toLowerCase(), fc = AT.$('#fc').value;
  const rows = all.filter(function (s) { return (!fc || String(s.classId) === fc) && (s.name + ' ' + s.index).toLowerCase().indexOf(q) >= 0; });
  AT.$('#tbl').innerHTML = rows.length ? '<table class="at-table"><thead><tr><th>Student</th><th>Index number</th><th>Class</th><th>Courses</th><th style="width:150px">Attendance</th><th></th></tr></thead><tbody>' + rows.map(function (s) {
    return '<tr><td><div class="d-flex align-items-center gap-3">' + AT.avatar(s.name) + '<div><div class="fw-600">' + AT.esc(s.name) + '</div><div class="small text-muted">' + AT.esc(s.email) + '</div></div></div></td><td class="mono">' + AT.esc(s.index) + '</td><td>' + AT.esc(s.class.name) + '</td><td class="small">' + (s.courseCodes.length ? s.courseCodes.map(AT.esc).join(', ') : '<span class="text-muted">None</span>') + '</td><td>' + AT.rateBar(s.rate) + '</td><td class="text-end"><button class="btn btn-sm btn-soft" data-id="' + s.id + '">History</button></td></tr>'; }).join('') + '</tbody></table>' : AT.empty('people', 'No students found', 'Share an invitation link so students can register.');
}
Promise.all([AT.api.students(), AT.api.classes()]).then(function (r) { all = r[0]; classes = r[1]; AT.$('#fc').innerHTML = '<option value="">All classes</option>' + classes.map(function (c) { return '<option value="' + c.id + '">' + AT.esc(c.name) + '</option>'; }).join(''); draw(); });
AT.$('#q').oninput = draw; AT.$('#fc').onchange = draw;
AT.$('#exp').onclick = function () { AT.download('students.csv', AT.csv([['Name', 'Index number', 'Class', 'Email', 'Phone']].concat(all.map(function (s) { return [s.name, s.index, s.class.name, s.email, s.phone]; })))); AT.toast('Exported students.csv'); };
document.addEventListener('click', function (e) { const b = e.target.closest('[data-id]'); if (!b) return;
  AT.api.student(b.dataset.id).then(function (d) {
    const rs = d.records.sort(function (a, b) { return new Date(b.session.date) - new Date(a.session.date); }); const att = rs.filter(function (r) { return r.status === 'present' || r.status === 'late'; }).length;
    AT.$('#mb').innerHTML = '<div class="d-flex align-items-center gap-3 mb-3">' + AT.avatar(d.student.name, 52) + '<div class="flex-grow-1"><h5 class="mb-0">' + AT.esc(d.student.name) + '</h5><div class="text-muted small">' + AT.esc(d.student.index) + ' · ' + AT.esc(d.class.name) + '</div></div><div class="text-end"><div class="stat-value">' + (rs.length ? Math.round(att / rs.length * 100) : 0) + '%</div><div class="stat-label">Overall</div></div></div>' +
      (rs.length ? '<div class="table-responsive"><table class="at-table"><thead><tr><th>Date</th><th>Course</th><th>Time</th><th>Status</th></tr></thead><tbody>' + rs.map(function (r) { return '<tr><td>' + AT.fmtDate(r.session.date) + '</td><td>' + AT.esc(r.course.code) + '</td><td>' + AT.fmtTime(r.time) + '</td><td>' + AT.badge(r.status) + '</td></tr>'; }).join('') + '</tbody></table></div>' : AT.empty('calendar-x', 'No attendance yet', 'This student has no recorded sessions.'));
    modal.show(); }); });
</script>
</body>
</html>
